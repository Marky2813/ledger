[project]
name = "ledger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sarthak Narula", email = "messagetosarthak@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.165.0",
    "ollama>=0.6.3",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ledger = "ledger:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
